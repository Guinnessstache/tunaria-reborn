[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunaria-reborn"
version = "0.2.0"
description = "Project Tunaria Reborn: an EverQuest Online Adventures (EQOA) Frontiers community server and reverse-engineered protocol library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "GuinnessStache" }]
keywords = ["eqoa", "everquest", "ps2", "private-server", "reverse-engineering", "protocol", "tunaria"]

[project.optional-dependencies]
pcap = ["scapy>=2.5"]
admin = ["psutil>=5.9"]
dev = ["pytest>=7", "scapy>=2.5"]

[project.scripts]
eqoa-server = "eqoa_server.main:main"

[project.urls]
Homepage = "https://github.com/Guinnessstache/tunaria-reborn"

[tool.setuptools]
packages = ["eqoa_server", "eqoa_protocol"]

[tool.setuptools.package-data]
eqoa_server = ["patch_data/*", "admin_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
